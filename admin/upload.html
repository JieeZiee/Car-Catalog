<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Upload — Car Catalog</title>
  <style>
    body{font-family:system-ui,Segoe UI,Arial;padding:20px;max-width:800px;margin:auto}
    label{display:block;margin-top:10px}
    input,textarea,select{width:100%;padding:8px;margin-top:6px}
    .small{width:200px}
    .actions{margin-top:12px}
    .thumb{max-width:160px;display:inline-block;margin-right:8px}
  </style>
</head>
<body>
  <h1>Admin — Tambah Listing Mobil</h1>
  <div id="auth">
    <button id="btn-login">Log in / Sign up</button>
    <span id="user-email" style="margin-left:12px"></span>
    <button id="btn-logout" style="display:none;margin-left:12px">Logout</button>
  </div>

  <form id="form" style="margin-top:16px">
    <label>Title<input name="title" required /></label>
    <label>Price<input name="price" type="number" /></label>
    <label>Year<input name="year" type="number" /></label>
    <label>Mileage<input name="mileage" type="number" /></label>
    <label>Location<input name="location" /></label>
    <label>Description<textarea name="description"></textarea></label>
    <label>WhatsApp<input name="whatsapp" /></label>
    <label>Status<select name="status"><option value="available">available</option><option value="sold">sold</option></select></label>

    <label>Images (select multiple)
      <input id="images" type="file" accept="image/*" multiple />
    </label>

    <div id="preview"></div>

    <div class="actions">
      <button type="submit">Submit</button>
    </div>
  </form>

  <div id="msg" style="margin-top:12px;color:green"></div>
  <div id="err" style="margin-top:12px;color:red"></div>

  <!-- Load Netlify Identity widget (if blocked by extensions this will still try to load) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js" onerror="console.warn('Netlify Identity widget failed to load')"></script>
  <script>
    // Cloudinary configuration (set to values you requested)
    window.CLOUDINARY_CLOUD_NAME = 'wi5x7kjb';
    window.CLOUDINARY_UPLOAD_PRESET = 'car-catalog_unsigned';

    // Robust Netlify Identity initialization: poll for availability and attach handlers
    function waitForIdentity(maxAttempts = 50, interval = 100) {
      return new Promise((resolve, reject) => {
        let attempts = 0;
        (function poll(){
          if(window.netlifyIdentity && typeof window.netlifyIdentity.open === 'function') return resolve(window.netlifyIdentity);
          attempts++;
          if(attempts >= maxAttempts) return reject(new Error('Netlify Identity widget not available'));
          setTimeout(poll, interval);
        })();
      });
    }

    function updateUI(user){
      const btnLogin = document.getElementById('btn-login');
      const btnLogout = document.getElementById('btn-logout');
      const userEmail = document.getElementById('user-email');
      if(user){
        btnLogin.style.display = 'none';
        btnLogout.style.display = 'inline-block';
        userEmail.textContent = user.email;
      } else {
        btnLogin.style.display = 'inline-block';
        btnLogout.style.display = 'none';
        userEmail.textContent = '';
      }
    }

    // Attach click handlers to login/logout buttons now. They will open the modal when identity is ready.
    (function attachAuthButtons(){
      const btnLogin = document.getElementById('btn-login');
      const btnLogout = document.getElementById('btn-logout');
      btnLogin.addEventListener('click', ()=>{
        if(window.netlifyIdentity && window.netlifyIdentity.open) return window.netlifyIdentity.open('login');
        // If widget not loaded yet, wait and then open
        waitForIdentity().then(id => id.open('login')).catch(err => {
          console.error('Netlify Identity unavailable:', err);
          alert('Login currently unavailable. Please try again or use another browser.');
        });
      });
      btnLogout.addEventListener('click', ()=>{
        if(window.netlifyIdentity && window.netlifyIdentity.logout) return window.netlifyIdentity.logout();
        waitForIdentity().then(id => id.logout()).catch(()=>{});
      });
    })();

    // Initialize identity if available and hook events
    waitForIdentity().then(id => {
      try{ id.init(); }catch(e){ /* ignore */ }
      id.on('init', user => updateUI(user));
      id.on('login', user => { updateUI(user); id.close(); });
      id.on('logout', () => updateUI(null));
      // If already logged in, update UI
      if(id.currentUser) try{ updateUI(id.currentUser()); }catch(e){}
    }).catch(err => {
      console.warn('Netlify Identity not ready:', err);
    });

    // Form handling and Cloudinary upload
    const form = document.getElementById('form');
    const imagesInput = document.getElementById('images');
    const preview = document.getElementById('preview');
    const msg = document.getElementById('msg');
    const errEl = document.getElementById('err');

    let selectedFiles = [];
    imagesInput.addEventListener('change', (e)=>{
      selectedFiles = Array.from(e.target.files);
      preview.innerHTML = '';
      selectedFiles.forEach(f=>{
        const img = document.createElement('img'); img.className='thumb'; img.src = URL.createObjectURL(f); preview.appendChild(img);
      });
    });

    async function uploadToCloudinary(file){
      const cloudName = window.CLOUDINARY_CLOUD_NAME || '';
      const preset = window.CLOUDINARY_UPLOAD_PRESET || '';
      if(!cloudName || !preset) throw new Error('Cloudinary credentials not set. Set CLOUDINARY_CLOUD_NAME and CLOUDINARY_UPLOAD_PRESET in the page or Netlify env.');
      const url = `https://api.cloudinary.com/v1_1/${cloudName}/upload`;
      const fd = new FormData();
      fd.append('file', file);
      fd.append('upload_preset', preset);
      const r = await fetch(url, { method: 'POST', body: fd });
      if(!r.ok){
        const txt = await r.text();
        throw new Error('Cloudinary upload failed: ' + txt);
      }
      return await r.json();
    }

    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      msg.textContent=''; errEl.textContent='';
      // require login
      const user = (window.netlifyIdentity && window.netlifyIdentity.currentUser) ? window.netlifyIdentity.currentUser() : null;
      if(!user){ errEl.textContent='Please log in first.'; return; }
      try{
        // get JWT
        const jwt = await user.jwt();
        // upload images to Cloudinary
        const uploadedUrls = [];
        for(const file of selectedFiles){
          msg.textContent = 'Uploading ' + file.name + ' ...';
          const r = await uploadToCloudinary(file);
          uploadedUrls.push(r.secure_url || r.url);
        }
        msg.textContent = 'Submitting metadata...';
        // collect fields
        const data = {};
        new FormData(form).forEach((v,k)=>{ data[k]=v; });
        data.images = uploadedUrls;

        const res = await fetch('/.netlify/functions/add-car', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + jwt },
          body: JSON.stringify(data)
        });

        // Debug: handle non-JSON and show raw server response (helps diagnose HTML error pages)
        const contentType = res.headers.get('content-type') || '';
        if(!contentType.includes('application/json')){
          const text = await res.text();
          console.error('Non-JSON response from add-car:', res.status, text);
          errEl.textContent = 'Server response: ' + (text ? text.substring(0,800) : ('Status ' + res.status));
          return;
        }

        const j = await res.json();
        if(!res.ok) throw new Error(j.error || JSON.stringify(j));
        msg.textContent = 'Listing submitted — commit: ' + (j.commit && j.commit.sha ? j.commit.sha : 'ok');
        form.reset(); preview.innerHTML=''; selectedFiles=[];
      }catch(err){
        console.error(err); errEl.textContent = String(err);
      }
    });
  </script>
</body>
</html>
